<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przekierowanie...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- KONFIGURACJA SUPABASE ---
        const SUPABASE_URL = 'https://TWOJA_DOMENA.supabase.co';
        const SUPABASE_ANON_KEY = 'TWÓJ_KLUCZ_ANON';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRedirect() {
            const path = window.location.pathname;

            // Sprawdzamy, czy to link śledzący
            if (path.startsWith('/go/')) {
                // Wyciągamy to co po /go/ (np. darmowy_ebook)
                const slug = path.split('/go/')[1];

                if (slug) {
                    try {
                        // Wywołujemy naszą funkcję SQL 'increment_link_click'
                        await supabase.rpc('increment_link_click', { link_name: slug });
                    } catch (error) {
                        console.error('Błąd zliczania:', error);
                    }
                }
                
                // Przekierowanie na stronę główną (zawsze, nawet jak zliczanie zawiedzie)
                window.location.replace('/');
            } else {
                // Wyświetl zwykły komunikat 404 jeśli to nie /go/
                document.getElementById('not-found').style.display = 'block';
            }
        }

        // Uruchomienie funkcji
        handleRedirect();
    </script>
</head>
<body style="background-color: #f4f4f4; font-family: sans-serif; text-align: center; padding-top: 50px;">
    
    <div id="redirecting">
        <h2>Przenoszenie do strony głównej...</h2>
        <p>Sekunda, przygotowujemy wszystko dla Ciebie.</p>
    </div>

    <div id="not-found" style="display: none;">
        <h1>Błąd 404</h1>
        <p>Przepraszamy, ale podana strona nie istnieje.</p>
        <a href="/">Wróć na stronę główną</a>
    </div>

</body>
</html>
